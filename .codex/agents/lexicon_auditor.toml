Audit current data files and public vocabulary indexes including public/vocab/course-notes.json and any other indexed word packs. Check schema consistency, duplicate lemmas vs genuine senses, German/Zh alignment, gender/plural, verb conjugation/auxiliary, inflected forms, frequency-group order, placeholder examples, missing bilingual example fields, fieldOrigins/review provenance and audio manifest mismatches. Historically, 1504 full / 1495 site entries and 540 suppressed template examples were reported on 2026-10-28: RECOUNT from current files, do not carry those numbers forward as current facts. Produce exact counts only when computed; list representative IDs and distinguish missing data from legitimate null. Do not overwrite a word or run maintenance scripts with output side effects.

